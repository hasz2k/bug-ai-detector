          statusLiveDemo: 'Tryb Demo (Symulacja)',

          fillTitleDesc: 'Wypełnij tytuł i opis zgłoszenia!',

          apiError: 'Błąd API',

          reportsGeneratedDemo: '[DEMO] Raporty wygenerowane (symulacja)',
          downloadPdf: '📄 Pobierz PDF',
          downloadCsv: '📊 Pobierz CSV',
        },
        en: {
          subtitle: 'Autonomous QA Visual Inspection & Telemetry Analytics',
          kpiBlockers: 'Critical Blockers',
          kpiBlockersSub: '(-1 vs prev build)',
          kpiIssues: 'Detected Issues',
          kpiCoverage: 'Scenario Coverage',
          kpiBots: 'Active AI Bots',
          kpiBotsSub: 'in pool',
          agentLauncher: 'Autonomous QA Agent Launcher',
          phTargetUrl: 'Target URL',
          btnRunAgent: 'Run Agent Exploration',
          btnRunningAgent: 'Exploration running...',
          issueExporter: 'Export Issue to Tracker',
          phTitle: 'Bug Summary / Title',
          phDesc: 'Reproduction details & logs',
          executiveReports: 'Executive Reports',
          btnGenerateReports: 'Generate PDF & CSV Reports',
          liveTelemetry: 'Live AI Vision Telemetry Stream',
          waitingStream: 'Waiting for live detection stream...',
          noObjects: 'No objects detected on screen',
          objectsCount: 'objects',
          trendTitle: 'Bug Detection Trend vs Build Version',
          trendCritical: 'Blocker / Critical',
          trendMajor: 'Major / Minor',
          categoryTitle: 'Issue Classification Breakdown',
          catVisual: 'Visual/Texture',
          catLogic: 'Logic/Soft-lock',
          catFps: 'FPS Drops',
          catOcr: 'OCR Text',
          statusConnecting: 'Connecting...',
          statusLiveStream: 'Live Streaming',
          statusLiveDemo: 'Live Demo (Simulated)',
          fillTargetUrl: 'Please enter a target URL!',
          fillTitleDesc: 'Please fill in title and description!',
          issueCreated: 'Issue created',
          agentTriggered: 'Agent triggered',
          agentError: 'Agent launch error',
          apiError: 'API error',
          reportsGenerated: 'Reports generated:',
          reportsGeneratedDemo: '[DEMO] Reports generated (simulated)',
          downloadPdf: '📄 Download PDF',
          downloadCsv: '📊 Download CSV',
        },
      };

      const STATUS = {
        connecting: { key: 'statusConnecting', dot: 'bg-yellow-500 animate-pulse', text: 'text-slate-300' },
        live: { key: 'statusLiveStream', dot: 'bg-emerald-500', text: 'text-emerald-400' },
        demo: { key: 'statusLiveDemo', dot: 'bg-cyan-500 animate-pulse', text: 'text-cyan-400' },
      };

      const TOAST_STYLES = {
        success: 'border-emerald-500/40 text-emerald-300',
        error: 'border-rose-500/40 text-rose-300',
        info: 'border-cyan-500/40 text-cyan-300',
      };

      const LANG_ACTIVE = ['bg-cyan-600', 'text-white', 'font-bold'];
      const LANG_INACTIVE = ['text-slate-400', 'hover:text-white'];

      const MOCK_TREND = {
        builds: ['Build #1080', 'Build #1081', 'Build #1082', 'Build #1083', 'Build #1084'],
        critical: [4, 3, 2, 2, 1],
        major: [8, 6, 9, 7, 4],
      };
      const MOCK_CATEGORIES = {
        keys: ['catVisual', 'catLogic', 'catFps', 'catOcr'],
        values: [40, 25, 20, 15],
        colors: ['#06b6d4', '#f43f5e', '#eab308', '#a855f7'],
      };
      const DEMO_LABELS = ['button', 'input_field', 'warning_toast', 'modal_overlay'];

      const $ = (id) => document.getElementById(id);
      const els = {
        overlay: $('ai-overlay'),
        toasts: $('toasts'),
        list: $('detections-list'),
        count: $('detections-count'),
        fps: $('fps-counter'),
        statusDot: $('status-dot'),
        statusText: $('status-text'),
        targetUrl: $('target-url'),
        runAgentBtn: $('btn-run-agent'),
        runAgentLabel: $('run-agent-label'),
        issueTitle: $('issue-title'),
        issueDesc: $('issue-desc'),
        exportBtn: $('btn-export-reports'),
        reportsOutput: $('reports-output'),
      };

      const state = {
        lang: CONFIG.defaultLanguage,
        status: 'connecting',
        demo: false,
        hasFrame: false,
        fps: 0,
        detections: [],
      };

      const connection = { socket: null, attempts: 0, reconnectTimer: null, demoTimer: null };
      const charts = { trend: null, category: null };
      let renderQueued = false;

      const t = (key) => translations[state.lang][key] ?? key;
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

      function i18nNode(tag, key, className = '') {
        const node = document.createElement(tag);
        node.className = className;
        node.dataset.i18n = key;
        node.textContent = t(key);
        return node;
      }

      function setLabel(node, key) {
        node.dataset.i18n = key;
        node.textContent = t(key);
      }

      function toast(message, type = 'info') {
        const node = document.createElement('div');
        node.className = `bg-slate-900 border rounded-lg px-4 py-2 text-xs shadow-lg max-w-sm ${TOAST_STYLES[type]}`;
        node.textContent = message;
        els.toasts.appendChild(node);
        setTimeout(() => node.remove(), CONFIG.toastDurationMs);
      }

      function renderStatus() {
        const status = STATUS[state.status];
        els.statusDot.className = `w-2.5 h-2.5 rounded-full ${status.dot}`;
        els.statusText.className = `${status.text} font-medium`;
        els.statusText.textContent = t(status.key);
      }

      function setStatus(name) {
        state.status = name;
        renderStatus();
      }

      function applyTranslations() {
        const dict = translations[state.lang];
        document.documentElement.lang = state.lang;

        document.querySelectorAll('[data-i18n]').forEach((node) => {
          node.textContent = dict[node.dataset.i18n] ?? node.dataset.i18n;
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach((node) => {
          const text = dict[node.dataset.i18nPlaceholder];
          node.placeholder = text;
          node.setAttribute('aria-label', text);
        });
        document.querySelectorAll('[data-lang]').forEach((button) => {
          const active = button.dataset.lang === state.lang;
          button.classList.remove(...(active ? LANG_INACTIVE : LANG_ACTIVE));
          button.classList.add(...(active ? LANG_ACTIVE : LANG_INACTIVE));
          button.setAttribute('aria-pressed', String(active));
        });

        renderStatus();
        renderList();
        updateChartsLanguage();
      }

      function setLanguage(lang) {
        if (!translations[lang]) return;
        state.lang = lang;
        try { localStorage.setItem(CONFIG.languageStorageKey, lang); } catch (err) { /* storage niedostępny */ }
        applyTranslations();
      }

      function loadLanguage() {
        try {
          const saved = localStorage.getItem(CONFIG.languageStorageKey);
          if (saved && translations[saved]) state.lang = saved;
        } catch (err) { /* storage niedostępny */ }
      }

      function pushFrame(fps, detections) {
        state.fps = Number(fps) || 0;
        state.detections = Array.isArray(detections) ? detections.filter((det) => det && det.bbox) : [];
        state.hasFrame = true;
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
          renderQueued = false;
          els.fps.textContent = state.fps.toFixed(1);
          renderOverlay();
          renderList();
        });
      }

      function renderOverlay() {
        const boxes = state.detections.map(({ label, bbox }) => {
          const box = document.createElement('div');
          box.className = 'absolute border-2 border-cyan-400 bg-cyan-500/10 text-cyan-300 font-mono text-[10px] px-1 rounded shadow-sm';
          Object.assign(box.style, { top: bbox.top, left: bbox.left, width: bbox.width, height: bbox.height });

          const tag = document.createElement('span');
          tag.className = 'bg-slate-950/90 border border-cyan-500/50 px-1 py-0.5 rounded -mt-5 inline-block';
          tag.textContent = label;
          box.appendChild(tag);
          return box;
        });
        els.overlay.replaceChildren(...boxes);
      }

      function detectionItem({ label, bbox }) {
        const item = document.createElement('li');
        item.className = 'flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800';

        const name = document.createElement('span');
        name.className = 'text-cyan-300 font-semibold';
        name.textContent = label;

        const coords = document.createElement('span');
        coords.className = 'text-slate-500 text-[11px]';
        coords.textContent = `T:${bbox.top} L:${bbox.left} W:${bbox.width} H:${bbox.height}`;

        item.append(name, coords);
        return item;
      }

      function renderList() {
        els.count.textContent = `${state.detections.length} ${t('objectsCount')}`;
        if (!state.hasFrame) return;

        if (state.detections.length === 0) {
          const empty = i18nNode('li', 'noObjects', 'italic text-slate-600');
          els.list.replaceChildren(empty);
          return;
        }
        els.list.replaceChildren(...state.detections.map(detectionItem));
      }

      function generateDemoFrame() {
        const detections = Array.from({ length: randomInt(1, 3) }, () => {
          const confidence = Number((0.8 + Math.random() * 0.18).toFixed(2));
          const label = DEMO_LABELS[randomInt(0, DEMO_LABELS.length - 1)];
          return {
            label: `${label} (${Math.round(confidence * 100)}%)`,
            confidence,
            bbox: {
              top: `${randomInt(25, 64)}%`,
              left: `${randomInt(30, 69)}%`,
              width: `${randomInt(12, 23)}%`,
              height: `${randomInt(6, 13)}%`,
            },
          };
        });
        return { fps: 56 + Math.random() * 4, detections };
      }

      function startDemo() {
        if (connection.demoTimer) return;
        state.demo = true;
        setStatus('demo');
        connection.demoTimer = setInterval(() => {
          const frame = generateDemoFrame();
          pushFrame(frame.fps, frame.detections);
        }, CONFIG.demoIntervalMs);
      }

      function stopDemo() {
        clearInterval(connection.demoTimer);
        connection.demoTimer = null;
        state.demo = false;
      }

      function handleMessage(event) {
        try {
          const { fps, detections } = JSON.parse(event.data);
          pushFrame(fps, detections);
        } catch (err) {
          console.warn('Niepoprawna ramka ze strumienia:', err);
        }
      }

      function scheduleReconnect() {
        const delay = Math.min(CONFIG.reconnectBaseMs * 2 ** connection.attempts, CONFIG.reconnectMaxMs);
        connection.attempts += 1;
        clearTimeout(connection.reconnectTimer);
        connection.reconnectTimer = setTimeout(connect, delay);
      }

      function handleDisconnect() {
        startDemo();
        scheduleReconnect();
      }

      function connect() {
        if (forceDemo) {
          startDemo();
          return;
        }

        let socket;
        try {
          socket = new WebSocket(WS_URL);
        } catch (err) {
          handleDisconnect();
          return;
        }
        connection.socket = socket;

        const timeout = setTimeout(() => socket.close(), CONFIG.connectTimeoutMs);
        socket.onopen = () => {
          clearTimeout(timeout);
          connection.attempts = 0;
          stopDemo();
          setStatus('live');
        };
        socket.onmessage = handleMessage;
        socket.onclose = () => {
          clearTimeout(timeout);
          handleDisconnect();
        };
      }

      function extractError(data) {
        const detail = data?.detail ?? data?.message;
        if (Array.isArray(detail)) return detail.map((item) => item.msg ?? JSON.stringify(item)).join('; ');
        return typeof detail === 'string' ? detail : null;
      }

      async function apiRequest(path, options) {
        const response = await fetch(`${API_BASE}${path}`, options);
        let data = null;
        try { data = await response.json(); } catch (err) { /* brak treści JSON */ }
        if (!response.ok) throw new Error(extractError(data) || `HTTP ${response.status}`);
        return data ?? {};
      }

      const postJson = (path, body) => apiRequest(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      async function withBusy(button, task) {
        button.disabled = true;
        try {
          return await task();
        } finally {
          button.disabled = false;
        }
      }

      async function runAgent() {
        const targetUrl = els.targetUrl.value.trim();
        if (!targetUrl) return toast(t('fillTargetUrl'), 'error');

        setLabel(els.runAgentLabel, 'btnRunningAgent');
        await withBusy(els.runAgentBtn, async () => {
          try {
            if (state.demo) {
              await sleep(CONFIG.demoAgentDelayMs);
              toast(`[DEMO] Agent Playwright → ${targetUrl}`, 'info');
            } else {
              const data = await apiRequest(`/api/run-agent?target_url=${encodeURIComponent(targetUrl)}`, { method: 'POST' });
              toast(data.message || t('agentTriggered'), 'success');
            }
          } catch (err) {
            toast(`${t('agentError')}: ${err.message}`, 'error');
          } finally {
            setLabel(els.runAgentLabel, 'btnRunAgent');
          }
        });
      }

      async function createIssue(system, button) {
        const title = els.issueTitle.value.trim();
        const description = els.issueDesc.value.trim();
        if (!title || !description) return toast(t('fillTitleDesc'), 'error');

        await withBusy(button, async () => {
          if (state.demo) {
            toast(`[DEMO] Ticket → ${system.toUpperCase()}: "${title}"`, 'info');
            return;
          }
          try {
            const data = await postJson('/api/create-issue', { title, description, system });
            toast(`${t('issueCreated')} (${data.issue_key ?? data.issue_id})`, 'success');
          } catch (err) {
            toast(`${t('apiError')}: ${err.message}`, 'error');
          }
        });
      }

      function renderReportLinks(reports) {
        const links = [
          { href: reports.pdf, key: 'downloadPdf' },
          { href: reports.csv, key: 'downloadCsv' },
        ].map(({ href, key }) => {
          const link = i18nNode('a', key, 'block text-cyan-400 hover:underline');
          link.href = `${API_BASE}${href}`;
          link.target = '_blank';
          link.rel = 'noopener';
          return link;
        });
        els.reportsOutput.replaceChildren(i18nNode('div', 'reportsGenerated', 'text-emerald-400'), ...links);
      }

      async function exportReports() {
        await withBusy(els.exportBtn, async () => {
          if (state.demo) {
            els.reportsOutput.replaceChildren(i18nNode('div', 'reportsGeneratedDemo', 'text-emerald-400'));
            return;
          }
          try {
            const data = await postJson('/api/export-report', {
              session_id: `session_${Date.now()}`,
              target_url: els.targetUrl.value.trim(),
              detections: state.detections,
            });
            renderReportLinks(data.reports);
          } catch (err) {
            toast(`${t('apiError')}: ${err.message}`, 'error');
          }
        });
      }

      function chartOptions(extra = {}) {
        return { responsive: true, maintainAspectRatio: false, ...extra };
      }

      function initCharts() {
        if (typeof Chart === 'undefined') {
          console.warn('Chart.js nie został załadowany – wykresy pominięte.');
          return;
        }

        if (charts.trend) charts.trend.destroy();
        if (charts.category) charts.category.destroy();

        const gridColor = 'rgba(51, 65, 85, 0.3)';
        const axis = { grid: { color: gridColor }, ticks: { color: '#64748b', font: { size: 10 } } };

        charts.trend = new Chart($('trend-chart').getContext('2d'), {
          type: 'line',
          data: {
            labels: MOCK_TREND.builds,
            datasets: [
              { data: MOCK_TREND.critical, borderColor: '#f43f5e', backgroundColor: 'rgba(244, 63, 94, 0.1)', tension: 0.3, fill: true },
              { data: MOCK_TREND.major, borderColor: '#06b6d4', backgroundColor: 'rgba(6, 182, 212, 0.1)', tension: 0.3, fill: true },
            ],
          },
          options: chartOptions({
            plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11 } } } },
            scales: { x: axis, y: axis },
          }),
        });

        charts.category = new Chart($('category-chart').getContext('2d'), {
          type: 'doughnut',
          data: {
            datasets: [{ data: MOCK_CATEGORIES.values, backgroundColor: MOCK_CATEGORIES.colors, borderWidth: 0 }],
          },
          options: chartOptions({
            plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 10 } } } },
          }),
        });
      }

      function updateChartsLanguage() {
        if (charts.trend) {
          charts.trend.data.datasets[0].label = t('trendCritical');
          charts.trend.data.datasets[1].label = t('trendMajor');
          charts.trend.update();
        }
        if (charts.category) {
          charts.category.data.labels = MOCK_CATEGORIES.keys.map(t);
          charts.category.update();
        }
      }

      function bindEvents() {
        document.querySelectorAll('[data-lang]').forEach((button) => {
          button.addEventListener('click', () => setLanguage(button.dataset.lang));
        });
        document.querySelectorAll('[data-issue-system]').forEach((button) => {
          button.addEventListener('click', () => createIssue(button.dataset.issueSystem, button));
        });
        els.runAgentBtn.addEventListener('click', runAgent);
        els.exportBtn.addEventListener('click', exportReports);
      }

      function init() {
        loadLanguage();
        initCharts();
        applyTranslations();
        bindEvents();
        connect();
      }

      init();
    })();
  </script>
</body>
</html>
