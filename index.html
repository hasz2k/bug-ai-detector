<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug AI Detector — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <!-- Dynamic Overlay Layer for AI Bounding Boxes -->
  <div id="ai-overlay" class="fixed inset-0 pointer-events-none z-50"></div>

  <div class="max-w-7xl mx-auto px-6 py-8">
    <!-- Header -->
    <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-5">
      <div class="flex items-center space-x-3">
        <span class="text-3xl">🤖</span>
        <div>
          <h1 class="text-2xl font-bold tracking-wide text-white">Bug AI Detector Engine</h1>
          <p class="text-xs text-slate-400">Live Screen Telemetry & Autonomous QA Agent</p>
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <div id="status-badge" class="flex items-center space-x-2 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-xs">
          <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></span>
          <span id="status-text" class="text-slate-300 font-medium">Connecting...</span>
        </div>
        <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-xs font-mono">
          FPS: <span id="fps-counter" class="text-cyan-400 font-bold">0.0</span>
        </div>
      </div>
    </header>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Left Panel: Actions & Control -->
      <div class="space-y-6">
        <!-- QA Agent Control -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
          <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wider mb-4">Autonomous QA Agent</h2>
          <div class="space-y-3">
            <input type="text" id="target-url" value="http://localhost:8085" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500" placeholder="Target URL">
            <button id="btn-run-agent" onclick="runAgent()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 px-4 rounded-lg text-sm transition-colors">
              🚀 Run Agent
            </button>
          </div>
        </div>

        <!-- Issue Export -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
          <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wider mb-4">Export Issue</h2>
          <div class="space-y-3">
            <input type="text" id="issue-title" placeholder="Bug Title" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
            <textarea id="issue-desc" placeholder="Bug Description" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500"></textarea>

            <div class="flex space-x-3">
              <button onclick="createIssue('jira')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-3 rounded-lg text-xs transition-colors">
                Export to Jira
              </button>
              <button onclick="createIssue('redmine')" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-medium py-2 px-3 rounded-lg text-xs transition-colors">
                Export to Redmine
              </button>
            </div>
          </div>
        </div>

        <!-- Report Download -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
          <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wider mb-4">Executive Reports</h2>
          <button onclick="exportReports()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-4 rounded-lg text-sm transition-colors border border-slate-600">
            📊 Generate PDF & CSV Reports
          </button>
          <div id="reports-output" class="mt-3 text-xs space-y-1"></div>
        </div>
      </div>

      <!-- Right Panel: Live Detections Feed -->
      <div class="lg:col-span-2 bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg flex flex-col">
        <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wider mb-4 flex justify-between items-center">
          <span>Live Detection Telemetry</span>
          <span id="detections-count" class="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-0.5 rounded-full font-mono">0 objects</span>
        </h2>

        <div class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-4 font-mono text-xs overflow-y-auto max-h-[450px]">
          <ul id="detections-list" class="space-y-2 text-slate-400">
            <li class="italic text-slate-600">Waiting for live WebSocket detection stream...</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    let lastDetections = [];
    const overlay = document.getElementById('ai-overlay');
    const detectionsList = document.getElementById('detections-list');
    const detectionsCount = document.getElementById('detections-count');
    const fpsCounter = document.getElementById('fps-counter');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    // Dynamiczny adres hosta (działa zarówno dla localhost, jak i 127.0.0.1)
    const host = window.location.hostname || '127.0.0.1';
    const isSecure = window.location.protocol === 'https:';
    const apiBase = `${isSecure ? 'https' : 'http'}://${host}:8000`;
    const wsUrl = `${isSecure ? 'wss' : 'ws'}://${host}:8000/ws/stream`;
    const socket = new WebSocket(wsUrl);

    socket.onopen = () => {
      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
      statusText.innerText = 'Live Streaming';
      statusText.className = 'text-emerald-400 font-medium';
    };

    socket.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        fpsCounter.innerText = data.fps || '0.0';
        lastDetections = data.detections || [];

        renderOverlay(lastDetections);
        renderList(lastDetections);
      } catch (err) {
        console.error("Payload error:", err);
      }
    };

    socket.onclose = () => {
      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-red-500';
      statusText.innerText = 'Disconnected';
      statusText.className = 'text-red-400 font-medium';
    };

    function renderOverlay(detections) {
      overlay.innerHTML = '';
      detections.forEach(det => {
        const box = det.bbox;
        const el = document.createElement('div');
        el.className = 'absolute border-2 border-cyan-400 bg-cyan-500/10 text-cyan-300 font-mono text-[10px] px-1 rounded shadow-sm transition-all duration-75';
        el.style.top = box.top;
        el.style.left = box.left;
        el.style.width = box.width;
        el.style.height = box.height;
        el.innerHTML = `<span class="bg-slate-900/90 border border-cyan-500/50 px-1 py-0.5 rounded -mt-5 inline-block">${det.label}</span>`;
        overlay.appendChild(el);
      });
    }

    function renderList(detections) {
      detectionsCount.innerText = `${detections.length} objects`;
      if (detections.length === 0) {
        detectionsList.innerHTML = '<li class="italic text-slate-600">No objects detected on screen</li>';
        return;
      }

      detectionsList.innerHTML = detections.map(det => `
        <li class="flex justify-between items-center bg-slate-800/60 p-2 rounded border border-slate-700/50">
          <span class="text-cyan-300 font-semibold">${det.label}</span>
          <span class="text-slate-500 text-[11px]">T:${det.bbox.top} L:${det.bbox.left} W:${det.bbox.width} H:${det.bbox.height}</span>
        </li>
      `).join('');
    }

    async function runAgent() {
      const targetUrl = document.getElementById('target-url').value;
      const btn = document.getElementById('btn-run-agent');
      btn.disabled = true;
      btn.innerText = '⏳ Agent running...';

      try {
        const res = await fetch(`${apiBase}/api/run-agent?target_url=` + encodeURIComponent(targetUrl), { method: 'POST' });
        const data = await res.json();
        alert(data.message || 'Agent triggered');
      } catch (err) {
        alert('Błąd uruchamiania agenta: ' + err);
      } finally {
        btn.disabled = false;
        btn.innerText = '🚀 Run Agent';
      }
    }

    async function createIssue(system) {
      const title = document.getElementById('issue-title').value;
      const description = document.getElementById('issue-desc').value;

      if (!title || !description) {
        alert('Wypełnij tytuł i opis zgłoszenia!');
        return;
      }

      try {
        const res = await fetch(`${apiBase}/api/create-issue`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, system })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          alert(`Zgłoszenie utworzone pomyślnie! (${data.issue_key || data.issue_id})`);
        } else {
          alert('Błąd: ' + (data.detail || data.message));
        }
      } catch (err) {
        alert('Błąd wywołania API: ' + err);
      }
    }

    async function exportReports() {
      const sessionId = 'session_' + Date.now();
      const targetUrl = document.getElementById('target-url').value;
      const output = document.getElementById('reports-output');

      try {
        const res = await fetch(`${apiBase}/api/export-report`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessionId,
            target_url: targetUrl,
            detections: lastDetections
          })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          output.innerHTML = `
            <div class="text-emerald-400">Wygenerowano raporty:</div>
            <a href="${apiBase}${data.reports.pdf}" target="_blank" class="block text-cyan-400 hover:underline">📄 Pobierz PDF</a>
            <a href="${apiBase}${data.reports.csv}" target="_blank" class="block text-cyan-400 hover:underline">📊 Pobierz CSV</a>
          `;
        } else {
          alert('Błąd generowania raportów: ' + data.detail);
        }
      } catch (err) {
        alert('Błąd API: ' + err);
      }
    }
  </script>
</body>
</html>
